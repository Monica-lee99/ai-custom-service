[project]
name = "server-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx==0.28.1",
    "pydantic==2.13.2",
    "python-dotenv==1.2.1",
    "uvicorn[standard]>=0.27,<1",
    "volcengine-python-sdk[ark]>=5.0.48",
]

[project.scripts]
server-python = "server_python:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
